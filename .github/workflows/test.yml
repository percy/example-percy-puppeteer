name: Tests

# PER-8195: explicitly use `pull_request` only. `pull_request_target` is
# forbidden — it checks out attacker-controlled code with full secret access.
on: [push, pull_request]

# Limit GITHUB_TOKEN to read-only (CodeQL: workflow-does-not-contain-permissions)
permissions:
  contents: read

jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: v1/${{ runner.os }}/node-18/${{ hashFiles('**/package-lock.json') }}
          restore-keys: v1/${{ runner.os }}/node-18/
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for Puppeteer
        # .npmrc sets ignore-scripts=true (supply-chain hardening, PER-9535), which
        # skips Puppeteer's postinstall browser download. Run that one trusted step
        # explicitly so the lifecycle-script block stays in place without breaking
        # the browser fetch the tests rely on.
        run: npx puppeteer browsers install chrome
      - name: Run tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm test

  advanced:
    # PER-8195 advanced example. Runs the advanced suite the same way the
    # basic job runs its suite — under Percy with the repo's PERCY_TOKEN.
    # No testing-mode coverage gate or external assertion helper (matches master).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: advanced
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 18
      - name: Install advanced/ dependencies
        run: npm install
      - name: Run advanced tests
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npm run test:advanced
